name: Unpack zip and build

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-and-dispatch:
    runs-on: ubuntu-latest
    env:
      PROTECTED_PATHS: .github .gitignore README.md LICENSE CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md docs
      ALLOW_WORKFLOWS: ${{ secrets.PAT_TOKEN != '' }}
      PUBLIC_REPO: LorelightOfficial/Lorelight-Manga-and-Novel-reader

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Detect uploaded zip
        id: detect
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n1 || true)
          if [ -z "$ZIP" ]; then
            echo "No .zip in repo root - nothing to unpack. Exiting cleanly."
            echo "has_zip=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found zip: $ZIP"
            echo "has_zip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract the uploaded zip
        if: steps.detect.outputs.has_zip == 'true'
        run: |
          set -e
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n1)
          echo "Extracting $ZIP"
          rm -rf /tmp/newtree
          mkdir -p /tmp/newtree
          unzip -q -o "$ZIP" -d /tmp/newtree
          if [ "$(ls -1 /tmp/newtree | wc -l)" = "1" ] && [ -d "/tmp/newtree/$(ls -1 /tmp/newtree)" ]; then
            INNER="/tmp/newtree/$(ls -1 /tmp/newtree)"
            if [ ! -f "$INNER/settings.gradle.kts" ] && [ ! -f "/tmp/newtree/settings.gradle.kts" ]; then
              echo "Flattening wrapper folder $INNER"
              mv "$INNER" /tmp/flat
              rm -rf /tmp/newtree
              mv /tmp/flat /tmp/newtree
            fi
          fi

      - name: Scrub credential files from the zip
        if: steps.detect.outputs.has_zip == 'true'
        run: |
          set -e
          cd /tmp/newtree
          LIST=/tmp/credential-files.txt
          : > "$LIST"
          # Collect matches into a file rather than a heredoc: a heredoc body
          # has to start at column 0, which is illegal inside this YAML block.
          for pat in '.env' '.env.*' '*.keystore' '*.jks' '*.keystore.base64' 'keystore.properties' 'signing.properties' 'secrets.properties' 'local.properties' 'google-services.json' '*.p12' '*.pem'; do
            find . -type f -name "$pat" ! -name '.env.example' -print >> "$LIST" 2>/dev/null || true
          done
          sort -u "$LIST" -o "$LIST"
          if [ -s "$LIST" ]; then
            while IFS= read -r f; do
              [ -n "$f" ] && rm -f "$f"
            done < "$LIST"
            echo "::warning::Credential files were found in the zip and were NOT committed: $(tr '\n' ' ' < "$LIST")"
          else
            echo "No credential files in the zip."
          fi

      - name: Replace repo content with zip contents
        if: steps.detect.outputs.has_zip == 'true'
        run: |
          set -e
          rm -rf /tmp/keep /tmp/zipflows
          mkdir -p /tmp/keep

          for p in $PROTECTED_PATHS; do
            if [ -e "$p" ]; then
              mkdir -p "/tmp/keep/$(dirname "$p")"
              cp -a "$p" "/tmp/keep/$p"
            fi
          done

          if [ "$ALLOW_WORKFLOWS" = "true" ] && [ -d /tmp/newtree/.github/workflows ]; then
            mkdir -p /tmp/zipflows
            cp -a /tmp/newtree/.github/workflows/. /tmp/zipflows/
          fi

          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '*.zip' -exec rm -rf {} +
          cp -a /tmp/newtree/. .

          RESTORED=""
          for p in $PROTECTED_PATHS; do
            if [ -e "/tmp/keep/$p" ]; then
              rm -rf "$p"
              mkdir -p "$(dirname "$p")"
              cp -a "/tmp/keep/$p" "$p"
              RESTORED="$RESTORED $p"
            fi
          done
          echo "::notice::Kept the repository's own files:$RESTORED (edit these on GitHub, not in the zip)."

          if [ -d /tmp/zipflows ]; then
            echo "PAT_TOKEN is present - applying the workflow files from the zip."
            mkdir -p .github/workflows
            cp -a /tmp/zipflows/. .github/workflows/
          fi

          rm -f *.zip

      
