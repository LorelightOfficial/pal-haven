name: Build ARM64 APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Test and build ARM64-v8a APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check source and run tests
        run: |
          npm run check
          npm test
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Prepare optional release signing
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          present=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -n "${!name}" ]; then present=$((present+1)); fi
          done
          if [ "$present" -eq 0 ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '### Debug ARM64 APK' >> "$GITHUB_STEP_SUMMARY"
            echo 'No signing secrets configured. Building one debug APK. Add all four secrets from docs/ANDROID-BUILD.md for a signed release APK.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$present" -ne 4 ]; then
            echo '::error::Configure all four ANDROID_* signing secrets, or remove all four for a debug build.'
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pal-haven-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/pal-haven-release.jks" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > /dev/null
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - name: Build debug ARM64 APK
        if: steps.signing.outputs.enabled != 'true'
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Build signed release ARM64 APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pal-haven-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          count=$(find android/app/build/outputs/apk -name '*arm64-v8a*.apk' | wc -l)
          test "$count" -eq 1
          find android/app/build/outputs/apk -name '*arm64-v8a*.apk' -exec sha256sum {} \;
          echo '### APK ready' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download Pal-Haven-arm64-v8a-APK from Artifacts. Only an APK is produced; no AAB, x86 or ARMv7 output.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Pal-Haven-arm64-v8a-APK
          path: android/app/build/outputs/apk/**/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/pal-haven-release.jks"
